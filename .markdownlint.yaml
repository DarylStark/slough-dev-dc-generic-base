# Markdownlint configuration
---
# MD013/line-length - Line length
MD013:
  # Set line length to 160 to allow for reasonable sentence structure
  line_length: 160
  # Don't check line length for code blocks, tables, and headings
  code_blocks: false
  tables: false
  headings: false

# MD041/first-line-heading - First line in file should be a top level heading
MD041:
  # Allow LICENSE and similar files to not start with a heading
  front_matter_title: ""
